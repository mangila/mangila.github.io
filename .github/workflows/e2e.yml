name: Cypress E2E

on:
  pull_request:
    paths:
      - "site/**"
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: 24

      - name: Cypress run
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # 7.4.6
        with:
          working-directory: ./site
          config: video=false
          install-command: npm ci
          build: npm run build
          start: npm run preview
          wait-on: 'http://localhost:4321'
          wait-on-timeout: 60

