[tools]
python = "3.15.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.run]
dir = "./site"
run = "npm run dev"

[tasks."format:check"]
dir = "./site"
run = "npm run format:check"

[tasks."format:write"]
dir = "./site"
run = "npm run format:write"

[tasks."cypress:run"]
dir = "./site"
run = "npm run cypress:run"

[tasks.install]
dir = "./site"
run = "npm install"